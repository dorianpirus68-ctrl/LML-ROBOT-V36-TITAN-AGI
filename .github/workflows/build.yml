name: Build LML Sniper APK

on: 
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create complete LML Robot AI Project and Build
        env:
          KEYSTORE_BASE64: ${{ secrets.LML_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          
          # Assignation sécurisée des variables par défaut
          export KEYSTORE_PASSWORD="${SECRET_KEYSTORE_PASSWORD:-android}"
          export KEY_ALIAS="${SECRET_KEY_ALIAS:-key0}"
          export KEY_PASSWORD="${SECRET_KEY_PASSWORD:-android}"

          echo "=== 1. Création de la structure ==="
          mkdir -p app/src/main/java/com/lml/robotai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LMLRobot"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.lml.robotai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lml.robotai"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-SnapBot"
              }
              signingConfigs {
                  release {
                      storeFile file('lml-stable.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      if (System.getenv('KEYSTORE_PASSWORD') != null && !System.getenv('KEYSTORE_PASSWORD').isEmpty()) {
                          signingConfig signingConfigs.release
                      }
                      minifyEnabled false
                  }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LML">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".LmlAccessibilityService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
                  <service android:name=".FloatingRobotService" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="Theme.LML" parent="Theme.AppCompat.Light.DarkActionBar" /></resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFEB3B" android:pathData="M54,54m-40,0a40,40 0,1 1,80 0a40,40 0,1 1,-80 0" />
              <path android:fillColor="#000000" android:pathData="M35,40 L73,40 L73,68 L35,68 Z M40,45 L68,45 L68,63 L40,63 Z" />
          </vector>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center" android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="LML Sniper V3 (Snap)" android:textSize="28sp" android:textStyle="bold" android:layout_marginBottom="32dp" />
              <Button android:id="@+id/btn_accessibility" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:text="Activer le cerveau (Accessibilité)" android:layout_marginBottom="16dp" />
              <Button android:id="@+id/btn_floating" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:text="Lancer la télécommande flottante" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">LML Sniper</string></resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFlags="flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="200" />
          EOF

          # --- LE CERVEAU SPÉCIAL SNAPCHAT (Appui Long & Séquence) ---
          cat > app/src/main/java/com/lml/robotai/LmlAccessibilityService.java << 'EOF'
          package com.lml.robotai;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.graphics.Rect;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import java.util.List;
          import java.util.Random;

          public class LmlAccessibilityService extends AccessibilityService {
              public static LmlAccessibilityService INSTANCE;
              public static boolean isAutoClickEnabled = false;

              private Handler handler = new Handler(Looper.getMainLooper());
              private Random random = new Random();
              
              private boolean isProcessingAction = false;
              private int friendsDeletedCount = 0;
              private final int MAX_DELETIONS = 1000;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  INSTANCE = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (!isAutoClickEnabled || isProcessingAction || friendsDeletedCount >= MAX_DELETIONS) return;

                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;

                  analyzeScreenAndAct(root);
              }

              private void analyzeScreenAndAct(AccessibilityNodeInfo root) {
                  // 1. DÉTECTION D'ERREUR : Si on est entré dans un Chat par erreur
                  List<AccessibilityNodeInfo> chatInputs = root.findAccessibilityNodeInfosByText("Envoyer un Chat");
                  if (!chatInputs.isEmpty()) {
                      executeAction(() -> {
                          performGlobalAction(GLOBAL_ACTION_BACK);
                          toast("Erreur : Dans un chat -> Retour");
                      }, getRandomDelay());
                      root.recycle();
                      return;
                  }

                  // 2. ÉTAPES DE CONFIRMATION (Du menu le plus profond vers le haut)

                  // Étape C : Popup finale "Supprimer"
                  List<AccessibilityNodeInfo> confirmNodes = root.findAccessibilityNodeInfosByText("Supprimer");
                  AccessibilityNodeInfo exactConfirmButton = findExactButton(confirmNodes, "supprimer");
                  if (exactConfirmButton != null) {
                      executeAction(() -> {
                          clickNode(exactConfirmButton);
                          friendsDeletedCount++;
                          toast("Ami supprimé ! (" + friendsDeletedCount + "/1000)");
                      }, getRandomDelay());
                      root.recycle();
                      return;
                  }

                  // Étape B : Option "Supprimer l'ami" dans le sous-menu
                  List<AccessibilityNodeInfo> removeNodes = root.findAccessibilityNodeInfosByText("Supprimer l'ami");
                  if (!removeNodes.isEmpty()) {
                      executeAction(() -> {
                          clickNode(removeNodes.get(0));
                          toast("Clic : Supprimer l'ami");
                      }, getRandomDelay());
                      root.recycle();
                      return;
                  }

                  // Étape A : Option "Gérer l'amitié" dans le menu contextuel
                  List<AccessibilityNodeInfo> manageNodes = root.findAccessibilityNodeInfosByText("Gérer l'amitié");
                  if (!manageNodes.isEmpty()) {
                      executeAction(() -> {
                          clickNode(manageNodes.get(0));
                          toast("Clic : Gérer l'amitié");
                      }, getRandomDelay());
                      root.recycle();
                      return;
                  }

                  // 3. ÉTAT LISTE : Faire un APPUI LONG sur un ami dans la liste
                  AccessibilityNodeInfo friendItem = findSnapchatFriendItem(root);
                  if (friendItem != null) {
                      executeAction(() -> {
                          Rect rect = new Rect();
                          friendItem.getBoundsInScreen(rect);
                          // APPUI LONG OBLIGATOIRE sur Snapchat pour ouvrir le menu
                          forceLongPress(rect.centerX(), rect.centerY());
                          toast("Appui long sur l'ami...");
                      }, getRandomDelay());
                  } else {
                      // 4. ÉTAT SCROLL : Aucun ami visible
                      executeAction(() -> {
                          performScrollDown();
                          toast("Défilement de la liste...");
                      }, getRandomDelay());
                  }

                  root.recycle();
              }

              private void executeAction(Runnable action, int delayMs) {
                  isProcessingAction = true;
                  handler.postDelayed(() -> {
                      if (isAutoClickEnabled) {
                          action.run();
                      }
                      handler.postDelayed(() -> isProcessingAction = false, 1200);
                  }, delayMs);
              }

              private int getRandomDelay() {
                  return random.nextInt(2001) + 2000; // 2s à 4s
              }

              private void toast(String msg) {
                  Toast.makeText(getApplicationContext(), msg, Toast.LENGTH_SHORT).show();
              }

              private AccessibilityNodeInfo findExactButton(List<AccessibilityNodeInfo> nodes, String targetText) {
                  for (AccessibilityNodeInfo node : nodes) {
                      CharSequence textObj = node.getText();
                      String text = textObj != null ? textObj.toString().toLowerCase().trim() : "";
                      if (text.equals(targetText) || (text.contains(targetText) && text.length() <= 12)) {
                          return node;
                      }
                  }
                  return null;
              }

              private AccessibilityNodeInfo findSnapchatFriendItem(AccessibilityNodeInfo node) {
                  if (node == null) return null;

                  if (node.isClickable() && hasChildWithText(node)) {
                      Rect r = new Rect();
                      node.getBoundsInScreen(r);
                      DisplayMetrics metrics = getResources().getDisplayMetrics();
                      
                      if (r.top > (metrics.heightPixels * 0.15) && r.bottom < (metrics.heightPixels * 0.85)) {
                          return node;
                      }
                  }

                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo result = findSnapchatFriendItem(node.getChild(i));
                      if (result != null) return result;
                  }
                  return null;
              }

              private boolean hasChildWithText(AccessibilityNodeInfo node) {
                  if (node == null) return false;
                  if (node.getText() != null && node.getText().length() > 0) return true;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      if (hasChildWithText(node.getChild(i))) return true;
                  }
                  return false;
              }

              private void clickNode(AccessibilityNodeInfo node) {
                  if (node == null) return;
                  Rect rect = new Rect();
                  node.getBoundsInScreen(rect);
                  forcePhysicalTap(rect.centerX(), rect.centerY());
              }

              private void forcePhysicalTap(int x, int y) {
                  Path path = new Path();
                  path.moveTo(x, y);
                  path.lineTo(x, y + 2);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(new GestureDescription.StrokeDescription(path, 0, 50));
                  dispatchGesture(builder.build(), null, null);
              }

              private void forceLongPress(int x, int y) {
                  Path path = new Path();
                  path.moveTo(x, y);
                  path.lineTo(x, y + 1);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(new GestureDescription.StrokeDescription(path, 0, 800));
                  dispatchGesture(builder.build(), null, null);
              }

              private void performScrollDown() {
                  DisplayMetrics metrics = getResources().getDisplayMetrics();
                  int middleX = metrics.widthPixels / 2;
                  int startY = (int) (metrics.heightPixels * 0.7);
                  int endY = (int) (metrics.heightPixels * 0.3);

                  Path path = new Path();
                  path.moveTo(middleX, startY);
                  path.lineTo(middleX, endY);

                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(new GestureDescription.StrokeDescription(path, 0, 400));
                  dispatchGesture(builder.build(), null, null);
              }

              @Override
              public void onInterrupt() {
                  isProcessingAction = false;
              }
          }
          EOF

          cat > app/src/main/java/com/lml/robotai/FloatingRobotService.java << 'EOF'
          package com.lml.robotai;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.LayoutInflater;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          public class FloatingRobotService extends Service {
              private WindowManager windowManager; 
              private View floatingView;
              private TextView robotTextView;

              @Override public IBinder onBind(Intent intent) { return null; }
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  showFloatingRobot(); 
                  return START_STICKY;
              }

              private void showFloatingRobot() {
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  floatingView = LayoutInflater.from(this).inflate(android.R.layout.simple_list_item_1, null);
                  robotTextView = floatingView.findViewById(android.R.id.text1);
                  
                  robotTextView.setText("🎯 SNAP-BOT OFF"); 
                  robotTextView.setTextSize(16); 
                  robotTextView.setTextColor(Color.RED);
                  robotTextView.setGravity(Gravity.CENTER);
                  
                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  params.gravity = Gravity.TOP | Gravity.START; params.x = 100; params.y = 300;
                  
                  floatingView.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY; 
                      private float initialTouchX, initialTouchY;
                      private long touchStartTime;
                      
                      @Override public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = params.x; initialY = params.y;
                                  initialTouchX = event.getRawX(); initialTouchY = event.getRawY();
                                  touchStartTime = System.currentTimeMillis();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int)(event.getRawX() - initialTouchX);
                                  params.y = initialY + (int)(event.getRawY() - initialTouchY);
                                  windowManager.updateViewLayout(floatingView, params); 
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  long touchDuration = System.currentTimeMillis() - touchStartTime;
                                  float diffX = Math.abs(event.getRawX() - initialTouchX);
                                  float diffY = Math.abs(event.getRawY() - initialTouchY);
                                  
                                  if (touchDuration < 200 && diffX < 10 && diffY < 10) {
                                      LmlAccessibilityService.isAutoClickEnabled = !LmlAccessibilityService.isAutoClickEnabled;
                                      if (LmlAccessibilityService.isAutoClickEnabled) {
                                          robotTextView.setText("🎯 SNAP-BOT ON");
                                          robotTextView.setTextColor(Color.GREEN);
                                      } else {
                                          robotTextView.setText("🎯 SNAP-BOT OFF");
                                          robotTextView.setTextColor(Color.RED);
                                      }
                                  }
                                  return true;
                          } return false;
                      }
                  });
                  windowManager.addView(floatingView, params);
              }
              @Override public void onDestroy() {
                  super.onDestroy();
                  if (floatingView != null) windowManager.removeView(floatingView);
              }
          }
          EOF

          cat > app/src/main/java/com/lml/robotai/MainActivity.java << 'EOF'
          package com.lml.robotai;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  Button btnAcc = findViewById(R.id.btn_accessibility);
                  Button btnFloat = findViewById(R.id.btn_floating);
                  
                  btnAcc.setOnClickListener((View v) -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      Toast.makeText(MainActivity.this, "Active 'LML Sniper' dans les services", Toast.LENGTH_LONG).show();
                  });
                  
                  btnFloat.setOnClickListener((View v) -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      } else {
                          startService(new Intent(MainActivity.this, FloatingRobotService.class));
                          Toast.makeText(MainActivity.this, "Télécommande flottante lancée !", Toast.LENGTH_SHORT).show();
                      }
                  });
              }
          }
          EOF

          echo "=== 2. Build ==="
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ] && [ ${#KEYSTORE_BASE64} -gt 100 ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/lml-stable.keystore
            ./gradlew clean assembleRelease --stacktrace
          else
            ./gradlew clean assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LML-Sniper-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

